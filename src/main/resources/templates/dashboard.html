<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMS - Customer Dashboard</title>
    <!-- ✅ Correct Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .navbar-brand { font-weight: 700; font-size: 1.5rem; }
        .card-balance { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; border-radius: 15px; }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand text-primary" href="#">Apex Bank</a>
        <div class="d-flex align-items-center">
            <span class="navbar-text text-white me-3">
                Welcome, <strong th:text="${currentUser.name}">User</strong>!
            </span>
            <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row">
        <!-- Left Side: Account Summaries -->
        <div class="col-md-7 mb-4">
            <h4 class="mb-3 fw-bold">Your Accounts</h4>

            <!-- Loop through accounts -->
            <div th:each="account : ${userAccounts}" class="card card-balance p-4 mb-3 border-0 shadow-sm">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="text-uppercase small opacity-75" th:text="${account.accountType}">CHECKING</span>
                        <!-- ✅ Changed currency symbol to $ -->
                        <h3 class="mb-1 fw-bold">$<span th:text="${account.balance}">0.00</span></h3>
                        <p class="mb-0 small opacity-75">Acc No: <span th:text="${account.accountNumber}">0000000000</span></p>
                    </div>
                    <span class="badge bg-success text-uppercase" th:text="${account.status}">ACTIVE</span>
                </div>
            </div>

            <!-- Empty accounts case -->
            <div th:if="${#lists.isEmpty(userAccounts)}" class="alert alert-warning">
                You don't have any open accounts yet. Please contact an administrator.
            </div>
        </div>

        <!-- Right Side: Quick Actions -->
        <div class="col-md-5">
            <div class="card p-4 border-0 shadow-sm rounded-3">
                <h4 class="mb-3 fw-bold">Quick Actions</h4>

                <div id="actionStatus" class="alert d-none" role="alert"></div>

                <form id="quickActionForm">
                    <div class="mb-3">
                        <label class="form-label">Select Action</label>
                        <select class="form-select" id="actionType" required>
                            <option value="deposit">Cash Deposit</option>
                            <option value="withdraw">Cash Withdrawal</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Target Account Number</label>
                        <select class="form-select" id="targetAccount" required>
                            <!-- Populate account options -->
                            <option th:each="acc : ${userAccounts}" th:value="${acc.accountNumber}" th:text="${acc.accountNumber + ' (' + acc.accountType + ')'}"></option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <!-- ✅ Updated label to show USD -->
                        <label class="form-label">Amount (USD)</label>
                        <input type="number" class="form-control" id="amount" min="1" step="0.01" required placeholder="Enter amount">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Execute Transaction</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- ✅ Bootstrap JS bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('quickActionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const action = document.getElementById('actionType').value;
        const accountNumber = document.getElementById('targetAccount').value;
        const amount = document.getElementById('amount').value;
        const statusDiv = document.getElementById('actionStatus');

        statusDiv.className = "alert d-none";

        const payload = {
            sourceAccountNumber: action === 'withdraw' ? accountNumber : null,
            destinationAccountNumber: action === 'deposit' ? accountNumber : null,
            amount: parseFloat(amount)
        };

        try {
            const response = await fetch(`/api/transactions/${action}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                statusDiv.className = "alert alert-success";
                statusDiv.innerText = "Transaction successful! Reloading your dashboard...";
                setTimeout(() => window.location.reload(), 1500);
            } else {
                statusDiv.className = "alert alert-danger";
                statusDiv.innerText = "Transaction failed. Check account configurations or limits.";
            }
        } catch (error) {
            statusDiv.className = "alert alert-danger";
            statusDiv.innerText = "Network connection failed.";
        }
    });
</script>
</body>
</html>
